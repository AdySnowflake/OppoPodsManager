name: Build macOS x64

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build-macos-x64:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Reuses the local build script (publish + .app bundle + ad-hoc sign)
      # so CI and local builds stay identical.
      - name: Build macOS x64 .app
        shell: bash
        run: ./build-macos-x64.sh

      - name: Package (.app -> zip)
        shell: bash
        run: |
          cd bin/Release/net10.0/osx-x64
          ditto -c -k --sequesterRsrc --keepParent OppoPodsManager.app OppoPodsManager-osx-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: OppoPodsManager-osx-x64
          path: bin/Release/net10.0/osx-x64/OppoPodsManager-osx-x64.zip
          retention-days: 14
